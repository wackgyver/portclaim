# Append to /etc/pve/lxc/<CTID>.conf on Proxmox 7.x only (X200 is x86-64-v1).
# Privileged Debian CT. Do not USB-passthrough the stick: the host already
# exposes it as /dev/input/event*. Bind the whole directory so dock hotplug works.

unprivileged: 0
lxc.cgroup2.devices.allow: c 13:* rwm
lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir 0 0
