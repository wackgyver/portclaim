# usb-loom X200: EC auto hovered ~3650 RPM at 41-44 C. thinkfan owns the
# loop so a load can still climb to level 7. Use max of IBM thermal;
# -128 holes do not raise the trip. Level 0 holds through a ~46 C dock
# sensor so a 42 C CPU is not stuck on level 1.
tp_fan /proc/acpi/ibm/fan
tp_thermal /proc/acpi/ibm/thermal

